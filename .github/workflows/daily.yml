name: productivity

on:
  schedule:
    - cron: "00 13 * * *" 
  workflow_dispatch:         

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Do something pointless
        run: |
          MESSAGES=(
            "Placed left shoe on right foot"
            "Stared at wall for 12 minutes"
            "Rearranged the deck chairs"
            "Sneezed in a semicolon-friendly manner"
            "Refactoring: phase 3"
            "Renamed a variable in my head"
            "Fixed a bug that did not exist"
            "Argued with a houseplant"
            "Deployed nothing in particular to production"
            "Reticulated splines"
            "Added a comment and deleted it"
            "Blinked twice for good luck"
            "Moved a bookmark from one folder to another"
            "Held a very important meeting"
            "Optimized everything, at scale"
            "Turned it off and on again"
          )
          MSG="${MESSAGES[RANDOM % ${#MESSAGES[@]}]}"

          echo "$(date -u +%F): $MSG" >> LOG.md

          git config user.name "jmhalv"
          git config user.email "257144812+jmhalv@users.noreply.github.com"
          git add LOG.md
          git commit -m "$MSG"
          git push
